# 이벤트 데이터 자동 갱신.
#
# 이 저장소의 앱은 src/data/events.json 을 빌드 시점에 번들로 굽는다.
# 즉 데이터를 새로 넣으려면 커밋이 필요하다. 그 커밋을 사람 대신 여기서 만든다.
#
# 크롤러는 node 내장 기능만 쓴다. 다만 KOPIS(콘서트)는 공식 오픈API 라 인증키가
# 필요해서 KOPIS_SERVICE_KEY 시크릿을 쓴다 — 그 전까지는 시크릿이 없었다.
# 키가 없거나 만료되면 그 소스만 건너뛰고 팝가·오프메이트는 그대로 돈다
# (crawler/run.mjs 가 소스별로 실패를 격리한다).
name: 데이터 갱신

on:
  schedule:
    # 매일 04:00 KST (= 19:00 UTC 전날). 상대 서버가 한가한 시간대를 고른다
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간(일)'
        default: '90'
      limit:
        description: '소스별 최대 건수'
        default: '700'

# 앞선 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# 같은 파일을 두 잡이 동시에 커밋하면 푸시가 충돌한다
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  # 기본값은 읽기 전용이라, 이게 없으면 마지막 push 에서 403 이 난다
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 팝가·오프메이트 1400건 + KOPIS 350건(목록 3 + 상세 250 + 공연장 100) 정도다.
    # 700ms 간격이라 최소 20분, 네트워크 지연까지 보면 25분대다
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 수집
        env:
          # KOPIS 만 쓴다. 없으면 그 소스가 건너뛰어지고 나머지는 수집된다
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: |
          node crawler/run.mjs \
            --source all \
            --limit ${{ github.event.inputs.limit || '700' }} \
            --days ${{ github.event.inputs.days || '90' }}

      - name: 정규화
        run: node crawler/to-events.mjs

      - name: 누락 후보 요약
        # 새벽에 도는 잡이라 로그를 아무도 안 본다. 실행 요약에 붙여 두면
        # Actions 탭에서 바로 보이고, 사람이 훑어보고 화이트리스트에 추가할 수 있다
        if: always()
        run: |
          node -e '
            const fs = require("fs")
            const p = "data/miss-candidates.json"
            if (!fs.existsSync(p)) process.exit(0)
            const c = JSON.parse(fs.readFileSync(p, "utf8"))
            let md = "## 화이트리스트 누락 후보 " + c.length + "건\n\n"
            if (!c.length) md += "없음.\n"
            else {
              md += "연예인·셀럽 카테고리인데 `crawler/kpop-artists.json` 에 이름이 없어 빠진 것들이다.\n"
              md += "K-pop 이면 그 파일에 추가하고 `node crawler/to-events.mjs` 만 다시 돌리면 된다.\n\n"
              md += "| 제목 | 종료일 | 원본 |\n|---|---|---|\n"
              for (const x of c) md += "| " + x.title + " | " + x.endsOn + " | [링크](" + x.url + ") |\n"
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md)
          '

      - name: 검증
        # 크롤러가 조용히 깨졌을 때 빈 데이터를 커밋해 앱을 비우는 것을 막는다.
        # 실패해야 할 것은 실패하게 두는 편이, 틀린 데이터가 배포되는 것보다 낫다
        run: node scripts/validate-events.mjs

      - name: 변경분 커밋
        # 원장(known-subjects.json)도 같이 본다. 대상 주소를 만들 때 쓰는
        # 파일이라, 여기서 빠지면 새 대상 페이지가 다음 배포에 안 생기고
        # 끝난 대상의 종료일도 갱신되지 않는다
        run: |
          if git diff --quiet -- src/data/events.json src/data/known-subjects.json; then
            echo "변경 없음. 커밋 생략"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/events.json src/data/known-subjects.json
          git commit -m "data: 이벤트 갱신 ($(date -u '+%Y-%m-%d'))

          crawler/run.mjs + to-events.mjs 자동 실행 결과.
          .github/workflows/refresh-data.yml 이 매일 04:00 KST 에 돈다."

          # develop 에 그 사이 다른 push 가 들어오면 거절된다 (2026-09-09 실측 — 릴리스
          # 당일 develop 이 활발해서 20분 도는 크롤링 중 세 번 연속 걸렸다). 뒤 스텝
          # (백엔드 적재)은 로컬 파일만 읽어 이 push 성공 여부와 무관하지만, 그날 커밋
          # 자체를 잃지 않으려면 리베이스로 재시도한다.
          #
          # -X ours 로 충돌을 우리 쪽으로 정리한다 — events.json 은 매번 새로 만드는
          # 스냅샷이라(위 주석 참고) 남의 변경과 손으로 섞으면 어느 크롤러 실행도
          # 만들지 않을 파일이 된다. known-subjects.json 은 원장이라 원래는 합쳐야
          # 맞지만, 우리가 밀어붙이는 값도 방금 정규화를 거친 최신 원장이라 재시도
          # 실패보다는 낫다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 거절됨 (${i}/5) — rebase 후 재시도"
            git fetch origin develop
            git rebase origin/develop -X ours || { git rebase --abort; break; }
          done
          echo "::error::재시도로도 push 가 안 됐다. 다음 실행(내일 04:00 또는 수동 재실행)이 다시 시도한다"
          exit 1

      - name: 백엔드 적재
        # 커밋 스텝 뒤에 둔다. 실제 서비스를 떠받치는 것은 여전히 events.json 이라
        # (전환은 EV-08) 적재가 실패해도 그날 배포는 되어야 한다.
        # continue-on-error 도 그래서다 — D 에서 이관이 끝나면 걷어낸다
        #
        # 커밋이 생략된 날에도 돌려야 한다. 데이터가 안 바뀌었어도 적재가
        # last_crawled_at 을 갱신하는데, 그걸 건너뛰면 72시간 뒤 멀쩡한 행사가
        # "원본에서 사라진 것"으로 판정돼 목록에서 빠진다 (D-7)
        #
        # 주소·키가 없으면 스크립트가 스스로 건너뛰고 실행 요약에 남긴다.
        # 백엔드 배포와 시크릿 등록이 이 커밋보다 늦다
        #
        # if: always() 가 필요하다 — 이 스텝은 로컬에 이미 있는 events.json 만 읽어서
        # 앞선 「변경분 커밋」의 push 성공 여부와 무관한데, 기본값(전 스텝 성공해야 실행)
        # 그대로 두면 push 가 리베이스 재시도까지 다 실패했을 때 적재까지 같이 건너뛴다
        # (2026-09-09 실측 — 세 번째 실행에서 이 순서 때문에 적재가 세 번 다 안 돌았다)
        if: always()
        continue-on-error: true
        env:
          INGEST_API_BASE: ${{ secrets.INGEST_API_BASE }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: node scripts/upsert-events.mjs
