name: UI 변경 스크린샷 검사

# 프론트 PR 은 거의 다 화면 변경이라 스크린샷이 사실상 매번 필요한데, 템플릿의
# 스크린샷 칸은 비워도 아무 일이 없어 사람이 기억해야 했다 (docs/HARNESS.md).
# 화면 파일에 diff 가 있는 PR 에만 걸린다. 문서·크롤러·설정 PR 은 대상이 아니다.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: 화면이 바뀌었으면 스크린샷이 있는가
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 검사
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 도망갈 문을 하나 둔다. 안 쓰는 컴포넌트를 지우기만 한 PR 처럼
          # 찍을 화면이 없는 경우가 있고, 못 빠져나가면 아무 이미지나 붙이게
          # 되어 검사가 의미를 잃는다.
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx 'skip-screenshot'; then
            echo "::notice::skip-screenshot 라벨이 있어 건너뜁니다"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^src/(app|components)/' || true)
          if [ -z "$changed" ]; then
            echo "::notice::src/app · src/components 변경이 없어 건너뜁니다"
            exit 0
          fi

          gh pr view "$PR" --json body --jq '.body // ""' > body.md

          # 마크다운 이미지, img 태그, GitHub 이 업로드한 첨부 주소 셋을 본다.
          if grep -qE '!\[[^]]*\]\(|<img |user-images\.githubusercontent\.com|github\.com/user-attachments/' body.md; then
            echo "::notice::스크린샷을 확인했습니다"
            exit 0
          fi

          echo "::error::화면 파일이 바뀌었는데 PR 본문에 스크린샷이 없습니다. 붙이거나 skip-screenshot 라벨을 다세요."
          printf '%s\n' "$changed" | sed 's/^/  /'
          exit 1
