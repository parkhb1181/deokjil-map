# Metabase. 백엔드 EC2 의 /opt/metabase/ 에 둔다.
# 비밀번호는 옆의 .env 에 MB_DB_PASS=... 한 줄로 두고, .env 는 커밋하지 않는다.
services:
  metabase:
    image: metabase/metabase:v0.54.8
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_HOST: duckmoim-prod-db.cx2qeoiwuvew.ap-northeast-2.rds.amazonaws.com
      MB_DB_PORT: 3306
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${MB_DB_PASS}
      MB_SITE_URL: https://bi.duckmoim.com
      JAVA_OPTS: -Xmx1g
